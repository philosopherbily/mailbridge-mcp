[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbridge-mcp"
version = "0.1.0"
description = "A local IMAP/SMTP bridge with deterministic MCP and AI-agent setup guides"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MailBridge MCP contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Communications :: Email"]

[project.optional-dependencies]
keyring = ["keyring>=25.6,<26"]

[project.scripts]
mailbridge = "mailbridge.cli:main"

[project.urls]
Repository = "https://github.com/philosopherbily/mailbridge-mcp"
Issues = "https://github.com/philosopherbily/mailbridge-mcp/issues"

[tool.setuptools.packages.find]
include = ["mailbridge*"]
